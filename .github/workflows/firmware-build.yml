name: Build Sketches

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Sketches
    runs-on: ubuntu-24.04

    steps:
      - name: Check out RT_Arduino
        uses: actions/checkout@v4

      - name: Check out RT_Firmware_Libs
        uses: actions/checkout@v4
        with:
          repository: MIT-Rocket-Team/RT_Firmware_Libs
          path: external/RT_Firmware_Libs

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino and STM32duino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.Arduino_Core_STM32_dl
          key: ${{ runner.os }}-stm32duino-3.0.0

      - name: Install STM32duino core
        env:
          STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
        run: |
          arduino-cli core update-index --additional-urls "$STM32_INDEX_URL"
          arduino-cli core install STMicroelectronics:stm32@3.0.0 --additional-urls "$STM32_INDEX_URL"

      - name: Configure and compile every Balius sketch
        shell: bash
        run: |
          set -euo pipefail

          sketches=(
            Balius/flight_computer
            Balius/VRX_interface
            Balius/power_board/bms
            Balius/power_board/pwr
            Balius/tests/power_board/bms/hello_world
            Balius/tests/power_board/bms/pwr_serial_test
            Balius/tests/power_board/bms/transistor_on
            Balius/tests/power_board/pwr/bms_serial_test
            Balius/tests/power_board/pwr/converters_on_test
            Balius/tests/power_board/pwr/converters_off_test
            Balius/tests/power_board/pwr/hello_world
            Balius/tests/power_board/pwr/monitor_test
          )

          for sketch in "${sketches[@]}"; do
            build_dir="build/${sketch//\//_}"
            echo "Configuring $sketch"
            cmake -S "$sketch" -B "$build_dir" -G Ninja \
              -DSTM32DUINO_CORE_PATH="$HOME/.arduino15/packages/STMicroelectronics/hardware/stm32/3.0.0" \
              -DARDUINO_USER_LIBRARIES="${{ github.workspace }}/external"
            cmake --build "$build_dir" --parallel 2
          done
