name: Balius power board firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Sketches
    runs-on: ubuntu-24.04

    steps:
      - name: Check out RT_Arduino
        uses: actions/checkout@v4

      - name: Check out RT_Firmware_Libs
        uses: actions/checkout@v4
        with:
          repository: MIT-Rocket-Team/RT_Firmware_Libs
          ref: d3cd8b761480ff2055947cddfd9a6e57e36f5c74
          path: external/RT_Firmware_Libs

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino and STM32duino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.Arduino_Core_STM32_dl
          key: ${{ runner.os }}-stm32duino-3.0.0

      - name: Install STM32duino core
        env:
          STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
        run: |
          arduino-cli core update-index --additional-urls "$STM32_INDEX_URL"
          arduino-cli core install STMicroelectronics:stm32@2.12.0 --additional-urls "$STM32_INDEX_URL"

      - name: Configure and compile BMS
        run: |
          cmake -S Balius/power_board/bms -B build/bms -G Ninja \
            -DSTM32DUINO_CORE_PATH="$HOME/.arduino15/packages/STMicroelectronics/hardware/stm32/2.12.0" \
            -DARDUINO_USER_LIBRARIES="${{ github.workspace }}/external"
          cmake --build build/bms --parallel 2

      - name: Configure and compile PWR
        run: |
          cmake -S Balius/power_board/pwr -B build/pwr -G Ninja \
            -DSTM32DUINO_CORE_PATH="$HOME/.arduino15/packages/STMicroelectronics/hardware/stm32/2.12.0" \
            -DARDUINO_USER_LIBRARIES="${{ github.workspace }}/external"
          cmake --build build/pwr --parallel 2

      - name: Configure and compile flight computer
        run: |
          cmake -S Balius/flight_computer -B build/flight_computer -G Ninja \
            -DSTM32DUINO_CORE_PATH="$HOME/.arduino15/packages/STMicroelectronics/hardware/stm32/2.12.0" \
            -DARDUINO_USER_LIBRARIES="${{ github.workspace }}/external"
          cmake --build build/flight_computer --parallel 2
